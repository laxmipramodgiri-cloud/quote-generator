<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>✨ Quote Generator</h1>
        <p class="subtitle">Get inspired with a new quote</p>

        <!-- Quote Card -->
        <div class="quote-card">

            <p id="quote">Click the button to get a quote.</p>

            <h3 id="author">— Unknown</h3>

            <div class="buttons">
                <button id="newQuoteBtn">🔄 New Quote</button>
                <button id="favoriteBtn">❤️ Favorite</button>
                <button id="copyBtn">📋 Copy</button>
            </div>

        </div>

        <!-- History -->
        <div class="history-section">

            <h2>📜 Favorites History</h2>

            <div id="history">
                <p class="empty">No favorite quotes yet.</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
